spring.application.name=challenge-2025

spring.security.user.name=admin
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:admin123}
spring.security.user.roles=ADMIN

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accenture_challenge_2025_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
